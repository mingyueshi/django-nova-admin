<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'; style-src 'self'; img-src 'self' data:; script-src 'self'">
<title>登录页预览 · NOVA Admin</title>
<script src="./js/preferences-init.js"></script>
<link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./login.css"><link rel="stylesheet" href="./login-preview.css"><link rel="stylesheet" href="./presets.css">
<link rel="stylesheet" href="./vendor/nova-slider-captcha/slider.css">
<script defer src="./vendor/nova-slider-captcha/slider.js"></script>
<script type="module" src="./js/login.js"></script>
</head>
<body class="nova-admin login nova-login-demo">
<a class="login-skip" href="#demo-login-title">跳转到登录表单</a>
<div class="login-preview-toolbar"><a href="./#native-samples">‹ 返回</a><label><span class="login-visually-hidden">外观</span><select id="login-appearance"><option value="light">企业浅色</option><option value="dark">深色</option><option value="auto">跟随系统</option></select></label><label><span class="login-visually-hidden">配色方案</span><select id="login-palette" data-palette-select aria-describedby="palette-status"><option value="default">默认配色</option></select></label></div><p id="palette-status" class="palette-status" role="status"></p>
<main id="container">
<header id="header"><a class="login-brand" href="./"><span class="login-brand-mark" data-brand-initial aria-hidden="true">N</span><span data-brand-name>NOVA</span></a></header>
<div id="content"><div class="nova-login-layout">
<div class="nova-login-art" aria-hidden="true"><i></i><i></i><span class="nova-login-glyph" data-brand-initial>N</span></div>
<section class="nova-login-panel" aria-labelledby="demo-login-title"><h1 class="login-visually-hidden" id="demo-login-title" tabindex="-1">登录</h1>
<p class="login-demo-notice">虚构账号演示，不要输入真实密码</p>
<div class="login-verification-controls" aria-label="验证码演示设置">
<label for="captcha-provider">验证方式<select id="captcha-provider"><option value="image">图形验证码</option><option value="slider">拼图滑块</option></select></label>
<label for="captcha-policy">显示策略<select id="captcha-policy"><option value="progressive">异常时验证</option><option value="always">每次验证</option></select></label>
<label for="captcha-length" id="captcha-length-control">字符长度<select id="captcha-length"><option value="5">5 位</option><option value="6" selected>6 位</option><option value="8">8 位</option></select></label>
</div>
<p class="login-risk-status" id="login-risk-status" role="status" aria-live="polite"></p>
<form id="demo-login-form" novalidate autocomplete="off">
<div id="login-feedback" class="login-feedback" role="alert" tabindex="-1" hidden></div>
<div class="form-row"><label for="demo-username">用户名</label><input type="text" id="demo-username" name="demo_username" value="demo_admin" autocomplete="off" spellcheck="false" required aria-describedby="username-error"><span class="login-field-error" id="username-error"></span></div>
<div class="form-row"><label for="demo-password">密码</label><div class="login-password"><input id="demo-password" name="demo_password" type="password" value="NovaPreview123" autocomplete="off" required aria-describedby="password-error"><button type="button" id="password-visible" aria-label="显示演示密码" aria-pressed="false">显示</button></div><span class="login-field-error" id="password-error"></span></div>
<div class="form-row" id="image-captcha-section" hidden><div class="captcha-label-row"><label for="demo-captcha">验证码</label><span id="captcha-expiry" class="login-visually-hidden">2 分钟内有效</span></div><div class="login-captcha-row"><div class="login-captcha-image" id="captcha-graphic" role="img" aria-label="图形验证码，可刷新或改用文字验证"></div><div id="captcha-text" class="captcha-text" hidden></div><input type="text" id="demo-captcha" name="demo_captcha" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="captcha-help captcha-error" placeholder="输入图中字符" disabled></div><div class="captcha-actions"><button type="button" id="refresh-captcha">↻ 换一张</button><button type="button" id="captcha-alternative" aria-expanded="false" aria-controls="captcha-text">文字验证</button></div><p id="captcha-help" class="login-visually-hidden">不区分大小写。文字替代仅用于本地演示。</p><span class="login-field-error" id="captcha-error"></span><span id="captcha-announcement" class="login-visually-hidden" role="status" aria-live="polite"></span></div>
<div class="form-row" id="slider-captcha-section" hidden><span class="login-slider-label" id="slider-captcha-label">安全验证</span><div id="slider-captcha-mount" aria-labelledby="slider-captcha-label"></div><span class="login-field-error" id="slider-error" role="alert"></span></div>
<dialog id="demo-captcha-dialog" class="login-captcha-dialog" aria-modal="true" aria-labelledby="demo-captcha-title"><header><h2 id="demo-captcha-title" tabindex="-1">安全验证</h2><button type="button" id="close-demo-captcha" aria-label="关闭安全验证">×</button></header><div id="demo-captcha-slot"></div><button type="button" id="continue-demo-captcha">验证并登录</button></dialog>
<div class="submit-row"><button type="submit" id="login-submit">登录</button></div>
</form>
<section id="login-success" class="login-success" hidden aria-labelledby="login-success-title"><div aria-hidden="true" class="login-success-mark">✓</div><h2 id="login-success-title" tabindex="-1">演示验证通过</h2><p>这是本地交互结果，没有建立真实登录会话。</p><a class="login-primary-link" href="./#overview">进入演示工作台</a><button type="button" id="login-again">再次体验</button></section>
<details class="login-demo-tools"><summary>帮助与演示</summary><p>用户名：demo_admin<br>密码：NovaPreview123</p><div><button type="button" id="trigger-risk">模拟异常，显示验证码</button><button type="button" id="reset-risk">恢复正常登录状态</button><button type="button" id="expire-captcha">使当前验证码过期</button><label><input type="checkbox" id="fail-login">模拟下一次提交失败</label></div><p>图形与滑块均为本地交互演示，不提供防机器人保护。滑块复用 Nova Slider CAPTCHA 0.2.0 原组件，预览不发送验证请求；真实 Django 接入由服务端校验并一次性消费凭证。</p><a href="./#native-samples">真实 Django 模板样本</a><span class="login-demo-version"> · 预览 1.7.0</span></details>

</section></div></div></main>

<noscript><p class="login-noscript">此交互预览需要JavaScript。真实 Django 图片验证码支持无脚本提交与重载；拼图滑块需要 JavaScript。</p></noscript>
</body></html>

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light"><meta name="description" content="NOVA Admin — 保留 Django 原生能力的管理界面设计预览">
  <title>NOVA Admin · 控制台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css">
  <script>try{const saved=localStorage.getItem('nova-theme'),mode=['light','dark','auto'].includes(saved)?saved:'light';document.documentElement.dataset.themeMode=mode;document.documentElement.dataset.theme=mode==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):mode}catch{}</script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到内容</a>
  <div id="app"></div><div id="overlay-root"></div><div id="toast-root" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>

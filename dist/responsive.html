<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · 多尺寸预览</title><link rel="icon" href="./favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#090d15;color:#edf0f7;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}header{padding:22px 28px;border-bottom:1px solid #2a3144;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;background:#121927}h1{font-size:18px;margin:0 0 7px}p{font-size:12px;color:#96a0b8;margin:0;line-height:1.7}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,a{font:inherit;color:inherit;border:1px solid #354159;background:#1a2435;border-radius:7px;padding:9px 12px;text-decoration:none;cursor:pointer}select{font-size:12px}button{font-size:12px}button[aria-pressed=true]{background:#b4a0ff;color:#191527;border-color:#b4a0ff}main{padding:26px 28px;overflow:auto}.device-meta{display:flex;justify-content:space-between;font-size:12px;color:#99a3ba;margin-bottom:14px}.frame-stage{position:relative;margin:auto}.frame-box{transform-origin:top left;background:#0c101a;border:1px solid #344057;border-radius:10px;overflow:hidden;box-shadow:0 25px 80px #0006}iframe{display:block;border:0;background:#0c101a}.badge{font-size:11px;border:1px solid #354159;border-radius:5px;padding:3px 7px;white-space:nowrap}.original main{overflow:visible}.original header{min-width:100%;width:100vw}.note{padding:0 28px 22px;color:#8b95aa;font-size:11px;line-height:1.7}@media(max-width:650px){header{padding:19px 17px}.controls{gap:7px}button,select,a{font-size:11px;padding:8px 9px}main{padding:20px 17px}.device-meta{font-size:11px}.note{padding:0 17px 20px}}</style></head><body><header><div><h1>NOVA · 多尺寸预览</h1><p>同一个界面，按真实 CSS 视口宽度渲染。可在预览内正常操作。</p></div><div class="controls"><select id="viewport" aria-label="预览宽度"><option value="390">390 · 手机</option><option value="768">768 · 平板</option><option value="1440" selected>1440 · 桌面</option><option value="1920">1920 · 宽屏</option><option value="2560">2560 · 超宽屏</option></select><select id="page" aria-label="预览页面"><option value="extensions.html">项目扩展指南</option><option value="navigation-lab/zh-hans-light-custom.html">自定义令牌 · 浅色导航</option><option value="navigation-lab/zh-hans-dark-custom.html">自定义令牌 · 深色导航</option><option value="overview" selected>工作概览</option><option value="catalog">商品管理</option><option value="catalog/edit/101">复杂商品表单</option><option value="news">新闻封面列表</option><option value="users">用户管理</option><option value="roles">角色权限</option><option value="audit">操作日志</option><option value="components">组件预览</option><option value="settings">系统设置</option><option value="native-samples">原生模板对照页</option><option value="login.html">登录页与验证码演示</option><option value="native-admin/light/login.html">Django 浅色登录（只读）</option><option value="native-admin/dark/login.html">Django 深色登录（只读）</option><option value="native-admin/dark/changeform.html">Django 6.1 深色表单（只读）</option><option value="native-admin/light/changeform.html">Django 6.1 浅色表单（只读）</option><option value="native-admin/dark/changelist.html">Django 6.1 列表（只读）</option><option value="native-admin/dark/members.html">Django 成员头像（只读）</option><option value="native-admin/dark/news.html">Django 新闻封面（只读）</option><option value="native-admin/dark/validation-error.html">Django 6.1 错误（只读）</option><option value="navigation-lab/zh-hans-dark.html">Nova 导航交互 · 中文深色</option><option value="navigation-lab/zh-hans-light.html">Nova 导航交互 · 中文浅色</option><option value="navigation-lab/en-dark.html">Nova navigation · English dark</option><option value="navigation-lab/en-light.html">Nova navigation · English light</option><option value="native-admin/compact-light/changelist.html">企业浅色 · 紧凑列表（只读）</option><option value="native-admin/compact-dark/changeform.html">企业深色 · 紧凑表单（只读）</option><option value="native-admin/auto/changeform.html">企业跟随系统 · 表单（只读）</option><option value="navigation-lab/zh-hans-auto.html">Nova 导航交互 · 跟随系统</option><option value="native-admin/native/changeform.html">Django 原生恢复（只读）</option></select><button id="fit" aria-pressed="true">适应窗口</button><button id="actual" aria-pressed="false">原尺寸</button><a href="./">返回完整演示 ↗</a></div></header><main><div class="device-meta"><span id="dimensions"></span><span class="badge">浏览器 iframe 视口 · 非真实设备测试</span></div><div class="frame-stage" id="stage"><div class="frame-box" id="box"><iframe id="preview-frame" title="NOVA 管理界面预览" src="./index.html?frame=1#overview"></iframe></div></div></main><div class="note">“适应窗口”只缩放显示尺寸，内部布局仍按所选宽度计算。“原尺寸”支持横向滚动查看细节。当前浏览器里的模拟操作与主题设置共享。</div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('#stage'),box=document.querySelector('#box'),viewport=document.querySelector('#viewport');let fit=true;function resize(){const width=Number(viewport.value),height=width===390?1100:1100,available=document.querySelector('main').clientWidth-(innerWidth<=650?34:56),scale=fit?Math.min(1,available/(width+2)):1;frame.width=width;frame.height=height;box.style.width=(width+2)+'px';box.style.height=(height+2)+'px';box.style.transform='scale('+scale+')';stage.style.width=(width+2)*scale+'px';stage.style.height=(height+2)*scale+'px';document.querySelector('#dimensions').textContent=width+' × '+height+' CSS px · '+Math.round(scale*100)+'% 显示';document.body.classList.toggle('original',!fit)}viewport.addEventListener('change',resize);document.querySelector('#page').addEventListener('change',e=>{frame.src=(e.target.value.startsWith('native-admin/')||e.target.value.startsWith('navigation-lab/')||['login.html','extensions.html'].includes(e.target.value))?'./'+e.target.value:'./index.html?frame=1#'+e.target.value});document.querySelector('#fit').onclick=()=>{fit=true;document.querySelector('#fit').setAttribute('aria-pressed','true');document.querySelector('#actual').setAttribute('aria-pressed','false');resize()};document.querySelector('#actual').onclick=()=>{fit=false;document.querySelector('#fit').setAttribute('aria-pressed','false');document.querySelector('#actual').setAttribute('aria-pressed','true');resize()};addEventListener('resize',resize);resize();</script></body></html>

{% load i18n l10n %}
<label>
  {% if parameter == 'chart_tag' %}{% translate 'Include tags (optional)' context 'Nova demo' %}{% else %}{% translate 'Exclude tags (optional)' context 'Nova demo' %}{% endif %}
  <select name="{{ parameter }}" multiple>
    {% include "project_admin/product_tag_options.html" with selected_keys=rule.keys %}
  </select>
</label>
<label>
  {% if parameter == 'chart_tag' %}{% translate 'Inclusion match rule' context 'Nova demo' %}{% else %}{% translate 'Exclusion match rule' context 'Nova demo' %}{% endif %}
  <select name="{{ parameter }}_mode">
    <option value="any"{% if not rule.mode or rule.mode == 'any' %} selected{% endif %}>{% translate 'Match any tag' context 'Nova demo' %}</option>
    <option value="all"{% if rule.mode == 'all' %} selected{% endif %}>{% translate 'Match all tags' context 'Nova demo' %}</option>
    <option value="at_least"{% if rule.mode == 'at_least' %} selected{% endif %}>{% translate 'Match at least N tags' context 'Nova demo' %}</option>
    <option value="at_most"{% if rule.mode == 'at_most' %} selected{% endif %}>{% translate 'Match at most N tags' context 'Nova demo' %}</option>
    <option value="exact"{% if rule.mode == 'exact' %} selected{% endif %}>{% translate 'Match exactly N tags' context 'Nova demo' %}</option>
    <option value="not_exact"{% if rule.mode == 'not_exact' %} selected{% endif %}>{% translate 'Matched tag count differs from N' context 'Nova demo' %}</option>
    <option value="range"{% if rule.mode == 'range' %} selected{% endif %}>{% translate 'Match N to M tags' context 'Nova demo' %}</option>
    <option value="not_range"{% if rule.mode == 'not_range' %} selected{% endif %}>{% translate 'Matched tag count outside N to M' context 'Nova demo' %}</option>
    <option value="any_range"{% if rule.mode == 'any_range' %} selected{% endif %}>{% translate 'Match any of the specified tag count ranges' context 'Nova demo' %}</option>
    <option value="not_any_range"{% if rule.mode == 'not_any_range' %} selected{% endif %}>{% translate 'Match none of the specified tag count ranges' context 'Nova demo' %}</option>
    <option value="values_or_ranges"{% if rule.mode == 'values_or_ranges' %} selected{% endif %}>{% translate 'Match specified counts or ranges (* for any count, right endpoints may use infinity or +infinity)' context 'Nova demo' %}</option>
    <option value="not_values_or_ranges"{% if rule.mode == 'not_values_or_ranges' %} selected{% endif %}>{% translate 'Match none of the specified counts or ranges (* for any count, right endpoints may use infinity or +infinity)' context 'Nova demo' %}</option>
    <option value="one_of"{% if rule.mode == 'one_of' %} selected{% endif %}>{% translate 'Match one of the specified tag counts' context 'Nova demo' %}</option>
    <option value="not_one_of"{% if rule.mode == 'not_one_of' %} selected{% endif %}>{% translate 'Match none of the specified tag counts' context 'Nova demo' %}</option>
  </select>
</label>
<label>
  {% if parameter == 'chart_tag' %}{% translate 'Included tag count (N)' context 'Nova demo' %}{% else %}{% translate 'Excluded tag count (N)' context 'Nova demo' %}{% endif %}
  <input type="number" name="{{ parameter }}_min" min="0" step="1" value="{{ rule.minimum|default_if_none:1|unlocalize }}" data-minimum-for="{{ parameter }}">
</label>
<label>
  {% if parameter == 'chart_tag' %}{% translate 'Maximum included tags' context 'Nova demo' %}{% else %}{% translate 'Maximum excluded tags' context 'Nova demo' %}{% endif %}
  <input type="number" name="{{ parameter }}_max" min="0" step="1" value="{{ rule.maximum|default_if_none:rule.minimum|default_if_none:1|unlocalize }}">
</label>
<label>
  {% if parameter == 'chart_tag' %}{% translate 'Included tag counts or ranges' context 'Nova demo' %}{% else %}{% translate 'Excluded tag counts or ranges' context 'Nova demo' %}{% endif %}
  <input type="text" name="{{ parameter }}_ranges" value="{{ rule.ranges_text }}" placeholder="0-1, 3-4"
         data-range-error="{% translate 'Enter ranges such as ０-1, 3-４. Use halfwidth or fullwidth digits without leading zeros. Endpoints must be ordered and lie between zero and the number of selected tags.' context 'Nova demo' %}"
         data-mixed-error="{% translate 'Enter counts, intervals or comparisons such as ＜2, ＞3, ＜=４ or >＝６. Round brackets exclude an endpoint and square brackets include it. Use ∞, inf or infinity with -, − or － on the left. On the right, + and ＋ are optional. Each letter in inf or infinity may be ASCII or fullwidth, uppercase or lowercase, as in (－ｉnＦ,3] or [3,Iｎfｉnｉtｙ). Use round brackets on unbounded sides, including blank or * endpoints. A standalone * matches every count. Counts may mix halfwidth and fullwidth digits without leading zeros. Numeric endpoints must be ordered and lie between zero and the number of selected tags.' context 'Nova demo' %}">
</label>
<label>
  {% if parameter == 'chart_tag' %}{% translate 'Included match counts' context 'Nova demo' %}{% else %}{% translate 'Excluded match counts' context 'Nova demo' %}{% endif %}
  <select name="{{ parameter }}_counts" multiple data-range-error="{% translate 'Each count must be at most the number of selected tags.' context 'Nova demo' %}">
    {% for count in tag_count_choices %}<option value="{{ count|unlocalize }}"{% if count in rule.counts %} selected{% endif %}>{{ count }}</option>{% endfor %}
  </select>
</label>

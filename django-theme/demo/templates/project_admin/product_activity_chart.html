{% extends "nova_admin/daily_chart.html" %}
{% load i18n %}
{% block chart_controls %}
  <form method="get">
    <label>{% translate 'Date range' context 'Nova demo' %}
      <select name="chart_days">
        <option value="7"{% if activity.days == 7 %} selected{% endif %}>{% translate 'Last 7 days' context 'Nova demo' %}</option>
        <option value="30"{% if activity.days == 30 %} selected{% endif %}>{% translate 'Last 30 days' context 'Nova demo' %}</option>
      </select>
    </label>
    <button type="submit">{% translate 'Apply' context 'Nova Admin' %}</button>
  </form>
{% endblock %}
{% block chart_error %}
  {% if activity.invalid_range %}<p>{% translate 'Choose a range of 7 or 30 days.' context 'Nova demo' %}</p>{% else %}{{ block.super }}{% endif %}
{% endblock %}

{# Desktop-only brand sculpture; purely decorative, never authentication content. #}
{% block nova_login_art %}
{% if nova_admin_branding.login_background_url %}
<div class="nova-login-art nova-login-art--image" aria-hidden="true"><img class="nova-login-background" src="{{ nova_admin_branding.login_background_url|force_escape }}" alt="" decoding="async"></div>
{% else %}
<div class="nova-login-art" aria-hidden="true"><i></i><i></i><span class="nova-login-glyph">{{ site_title|first|default:'N' }}</span></div>
{% endif %}
{% endblock %}

{% load i18n %}
{% if nova_admin_active %}
<details class="nova-appearance">
  <summary>{% translate 'Appearance settings' context 'Nova Admin' %}<span class="nova-appearance-chevron" aria-hidden="true">⌄</span></summary>
  <div class="nova-appearance-panel">
    <p id="nova-appearance-help">{% translate 'Changes take effect only after Apply.' context 'Nova Admin' %}</p>
{% endif %}
<form class="nova-theme-switcher" method="post" action="{{ nova_admin_preference_url }}" aria-label="{% translate 'Admin appearance' context 'Nova Admin' %}"{% if nova_admin_active %} aria-describedby="nova-appearance-help"{% endif %}>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ nova_admin_return_path }}">
  <label for="nova-admin-mode">{% translate 'Appearance' context 'Nova Admin' %}</label>
  <select id="nova-admin-mode" name="mode">
    <option value="dark"{% if nova_admin_mode == 'dark' %} selected{% endif %}>{% translate 'Nova dark' context 'Nova Admin' %}</option>
    <option value="light"{% if nova_admin_mode == 'light' %} selected{% endif %}>{% translate 'Nova light' context 'Nova Admin' %}</option>
    <option value="auto"{% if nova_admin_mode == 'auto' %} selected{% endif %}>{% translate 'Nova auto' context 'Nova Admin' %}</option>
    <option value="native"{% if nova_admin_mode == 'native' %} selected{% endif %}>{% translate 'Django native' context 'Nova Admin' %}</option>
  </select>
  <label for="nova-admin-palette">{% translate 'Color palette' context 'Nova Admin' %}</label>
  <select id="nova-admin-palette" name="palette">
    <option value="default"{% if nova_admin_palette == 'default' %} selected{% endif %}>{% translate 'Project default' context 'Nova Admin' %}</option>
    <option value="teal"{% if nova_admin_palette == 'teal' %} selected{% endif %}>{% translate 'Healthcare teal' context 'Nova Admin' %}</option>
    <option value="indigo"{% if nova_admin_palette == 'indigo' %} selected{% endif %}>{% translate 'Professional indigo' context 'Nova Admin' %}</option>
    <option value="violet"{% if nova_admin_palette == 'violet' %} selected{% endif %}>{% translate 'Education violet' context 'Nova Admin' %}</option>
    <option value="terracotta"{% if nova_admin_palette == 'terracotta' %} selected{% endif %}>{% translate 'Retail terracotta' context 'Nova Admin' %}</option>
    <option value="graphite"{% if nova_admin_palette == 'graphite' %} selected{% endif %}>{% translate 'Graphite black' context 'Nova Admin' %}</option>
    <option value="midnight"{% if nova_admin_palette == 'midnight' %} selected{% endif %}>{% translate 'Midnight blue' context 'Nova Admin' %}</option>
    <option value="forest"{% if nova_admin_palette == 'forest' %} selected{% endif %}>{% translate 'Forest green' context 'Nova Admin' %}</option>
    <option value="amber"{% if nova_admin_palette == 'amber' %} selected{% endif %}>{% translate 'Warm amber' context 'Nova Admin' %}</option>
    <option value="ocean"{% if nova_admin_palette == 'ocean' %} selected{% endif %}>{% translate 'Deep ocean' context 'Nova Admin' %}</option>
    <option value="slate"{% if nova_admin_palette == 'slate' %} selected{% endif %}>{% translate 'Slate gray' context 'Nova Admin' %}</option>
    <option value="plum"{% if nova_admin_palette == 'plum' %} selected{% endif %}>{% translate 'Dusk plum' context 'Nova Admin' %}</option>
    <option value="coffee"{% if nova_admin_palette == 'coffee' %} selected{% endif %}>{% translate 'Mocha brown' context 'Nova Admin' %}</option>
    <option value="glacier"{% if nova_admin_palette == 'glacier' %} selected{% endif %}>{% translate 'Glacier blue' context 'Nova Admin' %}</option>
    <option value="rose"{% if nova_admin_palette == 'rose' %} selected{% endif %}>{% translate 'Rose red' context 'Nova Admin' %}</option>
    <option value="olive"{% if nova_admin_palette == 'olive' %} selected{% endif %}>{% translate 'Tundra olive' context 'Nova Admin' %}</option>
    <option value="ink"{% if nova_admin_palette == 'ink' %} selected{% endif %}>{% translate 'Polar night' context 'Nova Admin' %}</option>
  </select>
  <button type="submit">{% translate 'Apply' context 'Nova Admin' %}</button>
</form>
{% if nova_admin_active %}
  </div>
</details>
{% endif %}
